apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: telecom-dev


# helmGlobals: 
#    chartHome: ../../helm-charts


helmCharts:
  - name: nginx
    releaseName: nginx-dev
    namespace: telecom-dev
# Packge stored in github charts with index.yaml 
#     repo: https://shwethakrishnashetty-stack.github.io/telecom/charts

# package and stored in https://github.com/users/shwethakrishnashetty-stack/packages/container/package/my-nginx

    repo: oci://ghcr.io/shwethakrishnashetty-stack/my-nginx
    version: 0.2.0
    valuesFile: ../../helm-charts/nginx/values.yaml
    additionalValuesFiles:
      - values.yaml
